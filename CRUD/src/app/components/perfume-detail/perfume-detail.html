@if (perfume()) {
  <div class="my-6 p-6 bg-slate-50 rounded-lg border border-slate-200">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-slate-800 text-lg">🔍 Ficha Técnica Detalhada do Perfume</h3>
      <p-button label="Voltar à Lista" icon="pi pi-arrow-left" severity="secondary" [text]="true" (click)="voltar()" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 text-base text-slate-600 bg-white p-6 rounded-md shadow-sm border border-slate-100">
      <p><strong>Identificador (ID):</strong> <span class="text-slate-900 font-mono">{{ perfume()?.id }}</span></p>
      <p><strong>Nome Comercial:</strong> <span class="text-slate-900 font-medium">{{ perfume()?.nome }}</span></p>
      <p><strong>Preço Corrente:</strong> <span class="text-green-600 font-bold">{{ perfume()?.valor | currency: 'BRL' }}</span></p>
    </div>
  </div>
}
