<div class="flex justify-between items-center mb-6">
  <h2 class="text-lg font-bold text-slate-700">Catálogo Disponível</h2>
  <p-button label="Novo Perfume" icon="pi pi-plus" severity="success" (click)="irParaIncluir()" />
</div>

<p-table [value]="perfumeService.itens()" [stripedRows]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th> <th>Nome</th> <th>Preço</th> <th>Status</th> <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="font-medium">{{ item.id }}</td>
      <td>{{ item.nome }}</td>
      <td>{{ item.valor | currency: 'BRL' }}</td>
      <td>
        <span [class]="'px-3 py-1 rounded-full text-xs font-bold ' + (item.ativo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')">
          {{ item.ativo ? 'Disponível' : 'Esgotado' }}
        </span>
      </td>
      <td class="flex gap-2">
        <p-button icon="pi pi-search" [rounded]="true" [text]="true" severity="info" (click)="irParaDetalhar(item)" />
        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="irParaEditar(item)" />
        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="deletar(item.id)" />
      </td>
    </tr>
  </ng-template>
</p-table>
