<p-table [value]="listaDeItens()" [stripedRows]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="font-medium">{{ item.id }}</td>
      <td>{{ item.nome }}</td>
      <td>{{ item.valor | currency: 'BRL' }}</td>
      <td>
        <!-- Tag de Status  -->
        <span [class]="'px-3 py-1 rounded-full text-xs font-bold ' +
              (item.ativo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')">
          {{ item.ativo ? 'Disponível' : 'Esgotado' }}
        </span>
      </td>
      <td class="flex gap-2">
        <!-- Botão Detalhar (Lupa) -->
        <p-button icon="pi pi-search" [rounded]="true" [text]="true" severity="info" (click)="detalharEvent.emit(item)" />

        <!-- Botão Editar (Lápis) -->
        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="editarEvent.emit(item)" />

        <!-- Botão Remover (Lixeira) -->
        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="removerEvent.emit(item.id)" />
      </td>
    </tr>
  </ng-template>
</p-table>
