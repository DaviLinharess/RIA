<div class="max-w-6xl mx-auto mt-12 p-6">

  <p-card header="Gerenciamento de Perfumes" subheader="Projeto Caru - Interfaces Ricas">

    <div class="flex flex-col md:flex-row items-end gap-6 my-6">
      <!--Nome do produto-->
      <div class="flex flex-col gap-2 flex-1 w-full">
        <label class="font-semibold text-slate-600 text-sm">Nome do Produto</label>
        <input pInputText [(ngModel)]="novoItem.nome" class="w-full" />
      </div>

      <!-- Preço -->
      <div class="flex flex-col gap-2 w-full md:w-48">
        <label class="font-semibold text-slate-600 text-sm">Preço</label>
        <p-inputNumber [(ngModel)]="novoItem.valor" mode="currency" currency="BRL" class="w-full" />
      </div>

      <!-- Booleando Em Estoque -->
      <div class="flex flex-col items-center gap-2 px-2">
        <label class="font-semibold text-slate-600 text-sm">Em Estoque</label>
        <p-toggleswitch [(ngModel)]="novoItem.ativo" />
      </div>

      <!-- Botão que fica Cadastrar/Salvar -->
      <div class="flex gap-2 pb-1">
        <p-button [label]="novoItem.id > 0 ? 'Salvar' : 'Cadastrar'"
                  severity="success"
                  (click)="adicionarItem()" />

        @if (novoItem.id > 0) {
          <p-button label="Cancelar" severity="secondary" [text]="true" (click)="resetForm()" />
        }
      </div>
    </div>

    <hr class="border-t border-slate-200 my-8" />

    <p-table [value]="itens" [stripedRows]="true">

      <!-- Lista dos Perfumes (id, nome, valor) -->
      <ng-template pTemplate="body" let-item>
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="font-medium">{{ item.id }}</td>
          <td>{{ item.nome }}</td>
          <td>{{ item.valor | currency: 'BRL' }}</td>
          <td>
            <!-- Tag Disponível/Esgotado -->
            <span [class]="'px-3 py-1 rounded-full text-xs font-bold ' +
                  (item.ativo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')">
              {{ item.ativo ? 'Disponível' : 'Esgotado' }}
            </span>
          </td>
          <td class="flex gap-2">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="prepararEdicao(item)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="removerItem(item.id)" />
          </td>
        </tr>
      </ng-template>
    </p-table>

  </p-card>
</div>
